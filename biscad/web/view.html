<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>BISCAD Viewer</title>
  <meta name="description" content="Interactive 3D CAD model — BISCAD">
  <meta name="theme-color" content="#120c0d">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Big+Shoulders+Display:wght@800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/viewer.css">
  <script src="js/config.js"></script>
  <script type="importmap">
  { "imports": {
      "three": "./vendor/three/build/three.module.js",
      "three/addons/": "./vendor/three/addons/"
  } }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { background: var(--void); color: var(--bone); font: 400 12px/1.4 var(--body); overflow: hidden; -webkit-font-smoothing: antialiased; }
    [hidden] { display: none !important; }
    #stage { position: fixed; inset: 0; }
    .bar {
      position: fixed; z-index: 10; top: 0; left: 0; right: 0; height: 44px; display: flex; align-items: center; gap: 14px;
      padding: env(safe-area-inset-top, 0px) 10px 0 12px; pointer-events: none;
      background: linear-gradient(rgba(10, 5, 6, 0.75), rgba(10, 5, 6, 0));
    }
    .bar > * { pointer-events: auto; }
    .mark { display: flex; align-items: center; gap: 7px; text-decoration: none; color: var(--bone); }
    .mark img { width: 18px; height: 18px; border-radius: 3px; }
    .mark b { font: 800 17px/1 var(--display); letter-spacing: 0.08em; }
    .mark small { font: 600 9.5px/1 var(--body); letter-spacing: 0.18em; color: var(--ember); }
    .title { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px; justify-content: center; }
    .title h1 { font-weight: 500; font-size: 13px; color: var(--bone); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .title span { font: 500 11px/1 var(--mono); color: var(--ash); white-space: nowrap; }
    .actions { display: flex; gap: 4px; margin-left: auto; }
    .panel { position: fixed; z-index: 9; border-radius: 6px; background: var(--glass); border: 1px solid var(--line); box-shadow: var(--shadow); backdrop-filter: blur(12px); }
    .panel-h { display: flex; justify-content: space-between; align-items: center; height: 26px; padding: 0 10px; font-weight: 500; color: var(--bone); border-bottom: 1px solid var(--line); }
    .panel-h span:last-child { font: 500 10.5px/1 var(--mono); color: var(--smoke); }
    #treePanel { left: 12px; top: 52px; width: 270px; max-height: calc(100% - 210px); overflow: auto; }
    #selPanel { right: 12px; top: 170px; width: 270px; padding: 10px; max-height: calc(100% - 300px); overflow: auto; }
    .hide { display: none; }
    #tb { position: fixed; z-index: 10; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
    #steps { position: fixed; z-index: 9; left: 50%; transform: translateX(-50%); bottom: calc(62px + env(safe-area-inset-bottom, 0px)); width: min(760px, calc(100% - 24px)); border-radius: 6px; overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow); }
    .stats { position: fixed; z-index: 8; left: 14px; bottom: 18px; font: 500 10.5px/1.6 var(--mono); color: var(--smoke); pointer-events: none; }
    .msg { position: fixed; inset: 0; display: grid; place-items: center; z-index: 20; pointer-events: none; }
    .msg div { padding: 12px 16px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line_strong); box-shadow: var(--shadow); font-size: 12.5px; color: var(--ash); }
    .loading { position: fixed; left: 50%; top: 50%; width: 120px; height: 2px; transform: translate(-50%, -50%); background: var(--line); overflow: hidden; z-index: 20; }
    .loading::after { content: ""; position: absolute; inset: 0; width: 40%; background: var(--ember); animation: ld 1s ease-in-out infinite; }
    @keyframes ld { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    body.embed, body.embed #stage, body.embed .vc-viewer { background: transparent; }
    body.embed .loading { width: 64px; opacity: 0.5; }
    body.embed .bar, body.embed .panel, body.embed #tb, body.embed .stats, body.embed #steps { display: none !important; }
    @media (max-width: 640px) {
      .title, .mark small, .actions .vc-btn span { display: none; }
      #treePanel { left: 8px; right: 8px; width: auto; max-height: 40%; }
      #selPanel { left: 8px; right: 8px; width: auto; top: auto; bottom: 150px; max-height: 34%; }
      #tb { max-width: calc(100% - 16px); overflow-x: auto; }
      #steps { bottom: calc(60px + env(safe-area-inset-bottom, 0px)); }
      .vc-steps-meta, .vc-steps-n { display: none; }
      .stats { display: none; }
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <header class="bar">
    <a class="mark" href="index.html" target="_top"><img src="favicon.svg" alt=""><img src="campaign/wordmark.svg" alt="BISCAD" style="height:14px;width:auto"><small>VIEWER</small></a>
    <div class="title"><h1 id="name">Loading</h1><span id="sub"></span></div>
    <div class="actions">
      <button class="vc-btn" id="treeBtn" title="Parts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 5h6M4 12h6M4 19h6"/><rect x="13" y="3" width="7" height="4"/><rect x="13" y="10" width="7" height="4"/><rect x="13" y="17" width="7" height="4"/></svg><span>Parts</span></button>
      <button class="vc-btn" id="stepBtn" hidden title="Download STEP">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span>STEP</span></button>
      <a class="vc-btn vc-btn-dark" id="studioBtn" href="studio.html" target="_top"><span>Open in Studio</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 17L17 7M9 7h8v8"/></svg></a>
    </div>
  </header>
  <aside class="panel hide" id="treePanel"><div class="panel-h"><span>Parts</span><span id="partCount"></span></div><div id="tree"></div></aside>
  <aside class="panel hide" id="selPanel"><div id="sel"></div></aside>
  <div id="steps"></div>
  <div id="tb"></div>
  <div class="stats" id="stats"></div>
  <div class="loading" id="loading"></div>

  <script type="module">
    import { Viewer, mount_toolbar, PartTree, SelectionPanel, StepsBar, format_number } from './js/viewer.js';
    import { api, resolve_sample_scene_url } from './js/api.js';

    const page_query = new URLSearchParams(location.search);
    const requested_version_id = page_query.get('v');
    const is_embedded = page_query.get('embed') === '1';
    const select_element = (selector) => document.querySelector(selector);
    const set_page_title = (model_name, subtitle_text) => {
      select_element('#name').textContent = model_name;
      select_element('#sub').textContent = subtitle_text;
    };

    function add_embed_badge() {
      document.body.classList.add('embed');
      const embed_badge = Object.assign(document.createElement('a'), { className: 'vc-badge', target: '_blank', innerHTML: 'BISCAD<small>VIEW</small>' });
      embed_badge.href = location.href.replace(/[?&]embed=1/, '').replace('view.html&', 'view.html?');
      document.body.appendChild(embed_badge);
    }
    if (is_embedded) add_embed_badge();

    const viewer = new Viewer(select_element('#stage'), {
      show_view_cube: !is_embedded, view_cube_top_offset_in_pixels: 44, is_transparent: is_embedded, show_grid: !is_embedded,
      auto_rotate: is_embedded || page_query.get('spin') === '1', fit_margin_factor: is_embedded ? 1.12 : 1,
      is_interactive: !is_embedded || page_query.get('pick') === '1', enable_keyboard_shortcuts: !is_embedded,
      measure_with_kernel: (first_entity_id, second_entity_id, version_id) => api.post(`/v1/versions/${version_id}/measure`, { a: first_entity_id, b: second_entity_id }),
    });
    window.biscad_viewer = viewer;
    if (!is_embedded) {
      mount_toolbar(viewer, select_element('#tb'));
      new PartTree(viewer, select_element('#tree'));
      new SelectionPanel(viewer, select_element('#sel'));
    }
    const tree_panel = select_element('#treePanel');
    select_element('#treeBtn').onclick = () => tree_panel.classList.toggle('hide');
    viewer.addEventListener('selectionchange', (selection_event) => select_element('#selPanel').classList.toggle('hide', !selection_event.detail.ids.length && viewer.state.tool !== 'measure'));
    viewer.addEventListener('statechange', () => { if (viewer.state.tool === 'measure') select_element('#selPanel').classList.remove('hide'); });
    viewer.addEventListener('load', (load_event) => {
      const statistics = load_event.detail.statistics;
      const [width_in_millimeters, depth_in_millimeters, height_in_millimeters] = statistics.bounding_box.size.map((size_in_millimeters) => format_number(size_in_millimeters, 1));
      select_element('#partCount').textContent = statistics.part_count;
      select_element('#stats').innerHTML = `${width_in_millimeters} × ${depth_in_millimeters} × ${height_in_millimeters} mm<br>${statistics.face_count} faces · ${statistics.edge_count} edges · ${statistics.triangle_count.toLocaleString()} tris`;
      if (statistics.part_count > 1 && innerWidth > 640 && !is_embedded) tree_panel.classList.remove('hide');
    });
    const steps_bar = new StepsBar(viewer, select_element('#steps'), { load_step_scene: (build_step) => api.get(build_step.scene_url) });

    function show_load_failure(failure_html) {
      select_element('#loading').remove();
      document.body.appendChild(Object.assign(document.createElement('div'), { className: 'msg', innerHTML: `<div>${failure_html}</div>` }));
      select_element('#name').textContent = 'Not found';
    }

    async function show_saved_version(version_id) {
      const version_path = `/v1/versions/${encodeURIComponent(version_id)}`;
      const [version_scene, version_metadata] = await Promise.all([api.get(`${version_path}/scene`), api.get(version_path).catch(() => null)]);
      viewer.load_scene(version_scene, { version_id });
      const document_response = version_metadata?.document_id ? await api.get(`/v1/documents/${version_metadata.document_id}`).catch(() => null) : null;
      const model_name = document_response?.document?.name || version_scene.name || version_id;
      const version_summary = version_metadata?.summary;
      set_page_title(model_name, version_summary?.mass_g_steel != null ? `${format_number(version_summary.volume / 1000, 2)} cm³ · ${format_number(version_summary.mass_g_steel, 1)} g steel` : version_id);
      document.title = `${model_name} — BISCAD`;
      const step_button = select_element('#stepBtn');
      step_button.hidden = false;
      step_button.onclick = () => api.download(`/v1/versions/${version_id}/export/step`, `${model_name.replace(/[^\w.-]+/g, '_')}.step`).catch((export_error) => viewer.flash('Export failed: ' + export_error.message));
      select_element('#studioBtn').href = `studio.html?v=${encodeURIComponent(version_id)}` + (api.base_url ? `&api=${encodeURIComponent(api.base_url)}` : '');
      api.get(`${version_path}/steps`).then((steps_response) => steps_bar.set_steps(steps_response.steps || [], { final_scene: version_scene })).catch(() => {});
    }

    async function show_sample(sample_id) {
      const sample_scene = await viewer.load(resolve_sample_scene_url(sample_id));
      set_page_title(sample_scene.name || sample_id, 'sample');
      document.title = `${sample_id} — BISCAD`;
      select_element('#studioBtn').href = `studio.html?example=${sample_id}`;
    }

    async function show_requested_model() {
      try {
        if (requested_version_id) await show_saved_version(requested_version_id);
        else await show_sample((page_query.get('sample') || 'quadruped').replace(/[^\w-]/g, ''));
        if (page_query.get('view')) viewer.set_view(page_query.get('view'), false);
        if (page_query.get('highlight')) viewer.highlight(page_query.get('highlight'));
        select_element('#loading').remove();
      } catch (load_error) {
        console.error(load_error);
        show_load_failure(requested_version_id ? `Could not load version <b>${requested_version_id}</b> — ${load_error.message}` : `Could not load sample — ${load_error.message}`);
      }
    }
    show_requested_model();
  </script>
</body>
</html>

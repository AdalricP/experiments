<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>BISCAD Viewer</title>
  <meta name="description" content="Interactive 3D CAD model — BISCAD">
  <meta name="theme-color" content="#f7f7f5">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231a1a1a'/%3E%3Cpath d='M8 9l8 15 8-15' fill='none' stroke='%23fff' stroke-width='2.4'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Michroma&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/viewer.css">
  <script src="js/config.js"></script>
  <script type="importmap">
  { "imports": {
      "three": "./vendor/three/build/three.module.js",
      "three/addons/": "./vendor/three/addons/"
  } }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { background: var(--paper); color: var(--text); font-family: var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
    #stage { position: fixed; inset: 0; }
    .bar {
      position: fixed; z-index: 10; top: 0; left: 0; right: 0; height: 56px;
      display: flex; align-items: center; gap: 16px; padding: 0 16px; padding-top: env(safe-area-inset-top, 0px);
      pointer-events: none;
    }
    .bar > * { pointer-events: auto; }
    .mark { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--ink); }
    .mark b { font: 400 13px/1 var(--wide); letter-spacing: .5em; }
    .mark small { font: 500 9.5px/1 var(--sans); letter-spacing: .3em; color: var(--muted); }
    .title { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px; justify-content: center; }
    .title h1 { font: 400 11px/1 var(--wide); letter-spacing: .22em; text-transform: uppercase; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .title span { font: 500 11px/1 var(--mono); color: var(--faint); white-space: nowrap; }
    .actions { display: flex; gap: 6px; margin-left: auto; }
    [hidden] { display: none !important; }
    .panel {
      position: fixed; z-index: 9; background: var(--glass); border: 1px solid var(--line); box-shadow: var(--shadow);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    }
    .panel-h { display: flex; justify-content: space-between; align-items: center; padding: 12px 12px 8px; font: 500 10px/1 var(--sans); letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
    #treePanel { left: 16px; top: 64px; width: 280px; max-height: calc(100% - 200px); overflow: auto; }
    #treePanel.hide { display: none; }
    #selPanel { right: 16px; top: 190px; width: 280px; padding: 14px; max-height: calc(100% - 260px); overflow: auto; }
    #selPanel.hide { display: none; }
    #tb { position: fixed; z-index: 10; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
    #steps { position: fixed; z-index: 9; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); width: min(760px, calc(100% - 32px)); }
    .stats { position: fixed; z-index: 8; left: 16px; bottom: 22px; font: 500 10.5px/1.6 var(--mono); color: var(--faint); pointer-events: none; }
    .msg { position: fixed; inset: 0; display: grid; place-items: center; z-index: 20; pointer-events: none; }
    .msg div { padding: 14px 18px; background: #fff; border: 1px solid var(--line); box-shadow: var(--shadow); font-size: 13px; color: var(--muted); }
    .loading { position: fixed; left: 50%; top: 50%; width: 120px; height: 1px; transform: translate(-50%, -50%); background: var(--line); overflow: hidden; z-index: 20; }
    .loading::after { content: ""; position: absolute; inset: 0; width: 40%; background: var(--ink); animation: ld 1s ease-in-out infinite; }
    @keyframes ld { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    body.embed, body.embed #stage { background: transparent; }
    body.embed .vc-viewer { background: transparent; }
    body.embed .loading { width: 64px; opacity: .5; }
    body.embed .bar, body.embed .panel, body.embed #tb, body.embed .stats, body.embed #steps { display: none !important; }
    @media (max-width: 640px) {
      .title { display: none; }
      .mark small { display: none; }
      .actions .vc-btn span { display: none; }
      #treePanel { left: 8px; right: 8px; width: auto; top: 60px; max-height: 40%; }
      #selPanel { left: 8px; right: 8px; width: auto; top: auto; bottom: 136px; max-height: 34%; }
      #tb { max-width: calc(100% - 16px); overflow-x: auto; }
      #steps { bottom: calc(70px + env(safe-area-inset-bottom, 0px)); }
      .stats { display: none; }
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <header class="bar">
    <a class="mark" href="index.html" target="_top"><b>BISCAD</b><small>CLOUD</small></a>
    <div class="title"><h1 id="name">Loading</h1><span id="sub"></span></div>
    <div class="actions">
      <button class="vc-btn" id="treeBtn" title="Parts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 5h6M4 12h6M4 19h6"/><rect x="13" y="3" width="7" height="4"/><rect x="13" y="10" width="7" height="4"/><rect x="13" y="17" width="7" height="4"/></svg><span>Parts</span></button>
      <button class="vc-btn" id="stepBtn" hidden title="Download STEP">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span>STEP</span></button>
      <a class="vc-btn vc-btn-dark" id="studioBtn" href="studio.html" target="_top"><span>Open in Studio</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 17L17 7M9 7h8v8"/></svg></a>
    </div>
  </header>
  <aside class="panel hide" id="treePanel"><div class="panel-h"><span>Parts</span><span id="partCount"></span></div><div id="tree"></div></aside>
  <aside class="panel hide" id="selPanel"><div id="sel"></div></aside>
  <div id="steps"></div>
  <div id="tb"></div>
  <div class="stats" id="stats"></div>
  <div class="loading" id="loading"></div>

  <script type="module">
    import { Viewer, mountToolbar, PartTree, SelectionPanel, StepsBar, fmt } from './js/viewer.js';
    import { api, sampleUrl } from './js/api.js';

    const q = new URLSearchParams(location.search);
    const vid = q.get('v');
    const sample = q.get('sample');
    const embed = q.get('embed') === '1';
    const highlight = q.get('highlight');
    const view = q.get('view');
    if (embed) {
      document.body.classList.add('embed');
      const b = document.createElement('a');
      b.className = 'vc-badge';
      b.href = location.href.replace(/[?&]embed=1/, '').replace('view.html&', 'view.html?');
      b.target = '_blank';
      b.innerHTML = 'BISCAD<small>VIEW</small>';
      document.body.appendChild(b);
    }

    const viewer = new Viewer(document.getElementById('stage'), {
      cube: !embed, cubeTop: 52,
      transparent: embed, grid: !embed, autoRotate: embed || q.get('spin') === '1', fitMargin: embed ? 1.12 : 1,
      interactive: !embed || q.get('pick') === '1', shortcuts: !embed,
      measureProvider: (a, b, v) => api.post(`/v1/versions/${v}/measure`, { a, b }),
    });
    window.biscadViewer = viewer;
    if (!embed) {
      mountToolbar(viewer, document.getElementById('tb'), ['select', 'measure', 'section', 'explode', '|', 'views', 'fit', 'projection', '|', 'render', 'bbox', 'screenshot', 'help']);
      new PartTree(viewer, document.getElementById('tree'));
      new SelectionPanel(viewer, document.getElementById('sel'));
    }
    const treePanel = document.getElementById('treePanel');
    document.getElementById('treeBtn').onclick = () => treePanel.classList.toggle('hide');
    viewer.addEventListener('selectionchange', (e) => {
      document.getElementById('selPanel').classList.toggle('hide', !e.detail.ids.length && viewer.state.tool !== 'measure');
    });
    viewer.addEventListener('statechange', () => {
      if (viewer.state.tool === 'measure') document.getElementById('selPanel').classList.remove('hide');
    });
    viewer.addEventListener('load', (e) => {
      const s = e.detail.stats;
      document.getElementById('partCount').textContent = s.parts;
      document.getElementById('stats').innerHTML =
        `${fmt(s.bbox.size[0], 1)} × ${fmt(s.bbox.size[1], 1)} × ${fmt(s.bbox.size[2], 1)} mm<br>${s.faces} faces · ${s.edges} edges · ${s.triangles.toLocaleString()} tris`;
      if (s.parts > 1 && innerWidth > 640 && !embed) treePanel.classList.remove('hide');
    });

    const steps = new StepsBar(viewer, document.getElementById('steps'), {
      loadStepScene: (st) => api.get(st.scene_url),
    });

    function fail(msg) {
      document.getElementById('loading').remove();
      const m = document.createElement('div');
      m.className = 'msg';
      m.innerHTML = `<div>${msg}</div>`;
      document.body.appendChild(m);
      document.getElementById('name').textContent = 'Not found';
    }

    async function main() {
      try {
        if (vid) {
          const [scene, meta] = await Promise.all([
            api.get(`/v1/versions/${encodeURIComponent(vid)}/scene`),
            api.get(`/v1/versions/${encodeURIComponent(vid)}`).catch(() => null),
          ]);
          viewer.loadScene(scene, { versionId: vid });
          let name = scene.name || vid;
          if (meta?.document_id) {
            try { const d = await api.get(`/v1/documents/${meta.document_id}`); name = d.document?.name || name; } catch (e) {}
          }
          document.getElementById('name').textContent = name;
          document.title = `${name} — BISCAD`;
          const sm = meta?.summary;
          document.getElementById('sub').textContent = sm?.mass_g_steel != null ? `${fmt(sm.volume / 1000, 2)} cm³ · ${fmt(sm.mass_g_steel, 1)} g steel` : vid;
          const sb = document.getElementById('stepBtn');
          sb.hidden = false;
          sb.onclick = () => api.download(`/v1/versions/${vid}/export/step`, `${name.replace(/[^\w.-]+/g, '_')}.step`).catch((e) => viewer.flash('Export failed: ' + e.message));
          document.getElementById('studioBtn').href = `studio.html?v=${encodeURIComponent(vid)}` + (api.base ? `&api=${encodeURIComponent(api.base)}` : '');
          api.get(`/v1/versions/${encodeURIComponent(vid)}/steps`).then((r) => steps.setSteps(r.steps || [], { finalScene: scene })).catch(() => {});
        } else {
          const id = (sample || 'quadruped').replace(/[^\w-]/g, '');
          const scene = await viewer.load(sampleUrl(id));
          document.getElementById('name').textContent = scene.name || id;
          document.getElementById('sub').textContent = 'sample';
          document.title = `${id} — BISCAD`;
          document.getElementById('studioBtn').href = `studio.html?example=${id}`;
        }
        if (view) viewer.setView(view, false);
        if (highlight) viewer.highlight(highlight);
        document.getElementById('loading').remove();
      } catch (e) {
        console.error(e);
        fail(vid ? `Could not load version <b>${vid}</b> — ${e.message}` : `Could not load sample — ${e.message}`);
      }
    }
    main();
  </script>
</body>
</html>
